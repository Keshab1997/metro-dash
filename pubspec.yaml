name: metro_dash
description: "Metro Dash — a three-lane endless runner across a Kolkata sunset, built with Flutter."
publish_to: 'none'

# Batch 0 = first playable build of the reboot (see docs/ROADMAP_BATCHES.md).
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # local-only progress storage; no account, no backend
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
